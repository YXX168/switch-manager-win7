name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.20 is the last version that supports Windows 7.
          go-version: '1.20.14'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o dist/switch-manager-windows-${{ matrix.arch }}.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: switch-manager-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
